# Miata market report — comparable sales
#
# Scope: NB2 (2001-2005) Mazda MX-5, tracked on Cars & Bids.
# Add a comp by appending to `comps`. Fields:
#   id          Cars & Bids auction slug (the short code in the URL)
#   url         canonical auction URL (strip ?ss_id / ?ref tracking params)
#   year, model, trim
#   sold        true = hammer fell, false = reserve not met / bid to
#   reserve     false when listed NO RESERVE
#   price       final number in whole dollars, no commas or $
#   date        auction end date, YYYY-MM-DD
#   mileage     odometer at sale, whole miles
#   transmission  "6MT", "5MT", "4AT"
#   exterior, interior, location, vin
#   seller      "Private" or "Dealer"
#   bids, comments, photos
#   notes       one line: what moved the price up or down
#
# Anything left blank renders as an em dash. Prices are hammer price and do
# not include the Cars & Bids buyer fee.

